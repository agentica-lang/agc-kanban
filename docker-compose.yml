# Runs the API on Docker's default network for this project, with no published
# port: it is reachable only from this machine (at the container's IP, which
# `make url` prints) and from containers on the same network. Put the key in
# .env (not in git):
# KANBAN_API_KEY=...   (openssl rand -hex 32)
# Start with `make up`, stop with `make down`, smoke test with `make smoke-docker`.
# A local network, a fixed IP or a published port go in
# docker-compose.override.yml (not in git; see README.md).
services:
  kanban:
    build: .
    image: agc-kanban:local
    container_name: agc-kanban
    init: true
    restart: unless-stopped
    environment:
      KANBAN_API_KEY: ${KANBAN_API_KEY:?set KANBAN_API_KEY in .env}
      KANBAN_HOST: 0.0.0.0
      KANBAN_PORT: "4580"
      KANBAN_DATA_DIR: /data
      KANBAN_LEASE_MINUTES: "0"
      # 1 only behind HTTPS: over plain HTTP the browser drops a Secure cookie.
      KANBAN_COOKIE_SECURE: ${KANBAN_COOKIE_SECURE:-0}
    volumes:
      - kanban-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/4580' || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s


volumes:
  kanban-data:
